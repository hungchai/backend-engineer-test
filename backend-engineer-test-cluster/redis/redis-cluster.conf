# Redis Cluster Configuration for UTXO Indexer
# High Availability Cache Layer

# Basic Settings
port 6379
cluster-enabled yes
cluster-config-file nodes.conf
cluster-node-timeout 15000
cluster-announce-ip 127.0.0.1
cluster-announce-port 6379
cluster-announce-bus-port 16379

# Persistence
appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec
no-appendfsync-on-rewrite no
auto-aof-rewrite-percentage 100
auto-aof-rewrite-min-size 64mb

# Save to disk
save 900 1
save 300 10
save 60 10000

# Memory Management
maxmemory 2gb
maxmemory-policy allkeys-lru
maxmemory-samples 5

# Network Settings
tcp-keepalive 300
timeout 0
tcp-backlog 511

# Security
requirepass utxo-redis-cluster-password
masterauth utxo-redis-cluster-password

# Logging
loglevel notice
logfile /var/log/redis/redis-server.log
syslog-enabled yes
syslog-ident redis

# Performance Tuning
# Disable slow operations for high performance
slowlog-log-slower-than 10000
slowlog-max-len 128

# Client connections
maxclients 10000

# Advanced Settings
hash-max-ziplist-entries 512
hash-max-ziplist-value 64
list-max-ziplist-size -2
list-compress-depth 0
set-max-intset-entries 512
zset-max-ziplist-entries 128
zset-max-ziplist-value 64
hll-sparse-max-bytes 3000

# Lua scripting
lua-time-limit 5000

# Key eviction notifications
notify-keyspace-events "Ex"

# Streams
stream-node-max-bytes 4096
stream-node-max-entries 100

# TLS (optional, for production)
# tls-port 6380
# tls-cert-file redis.crt
# tls-key-file redis.key
# tls-ca-cert-file ca.crt

# Cluster-specific settings
cluster-migration-barrier 1
cluster-slave-validity-factor 10
cluster-require-full-coverage no 