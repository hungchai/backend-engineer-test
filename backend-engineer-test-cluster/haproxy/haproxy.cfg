global
    log stdout local0
    chroot /var/lib/haproxy
    stats socket /run/haproxy/admin.sock mode 660 level admin
    stats timeout 30s
    user haproxy
    group haproxy
    daemon

defaults
    mode http
    log global
    option httplog
    option dontlognull
    option log-health-checks
    option forwardfor
    option http-server-close
    timeout connect 5000
    timeout client 50000
    timeout server 50000
    errorfile 400 /etc/haproxy/errors/400.http
    errorfile 403 /etc/haproxy/errors/403.http
    errorfile 408 /etc/haproxy/errors/408.http
    errorfile 500 /etc/haproxy/errors/500.http
    errorfile 502 /etc/haproxy/errors/502.http
    errorfile 503 /etc/haproxy/errors/503.http
    errorfile 504 /etc/haproxy/errors/504.http

# HAProxy Statistics Page
frontend stats
    bind *:8404
    stats enable
    stats uri /stats
    stats refresh 30s
    stats admin if TRUE

# Main Frontend - HTTPS/HTTP Entry Point
frontend utxo_frontend
    bind *:80
    bind *:443 ssl crt /etc/ssl/certs/utxo-indexer.pem
    
    # Security Headers
    http-response set-header X-Frame-Options DENY
    http-response set-header X-Content-Type-Options nosniff
    http-response set-header X-XSS-Protection "1; mode=block"
    http-response set-header Strict-Transport-Security "max-age=31536000; includeSubDomains"
    
    # Redirect HTTP to HTTPS
    redirect scheme https code 301 if !{ ssl_fc }
    
    # Rate Limiting
    stick-table type ip size 100k expire 30s store http_req_rate(10s)
    http-request track-sc0 src
    http-request reject if { sc_http_req_rate(0) gt 100 }
    
    # Route to API Gateway
    default_backend api_gateway_cluster

# API Gateway Backend Pool
backend api_gateway_cluster
    balance roundrobin
    option httpchk GET /health
    http-check expect status 200
    
    # API Gateway Instances
    server kong-1 api-gateway-1:8000 check inter 5s fall 3 rise 2 weight 100
    server kong-2 api-gateway-2:8000 check inter 5s fall 3 rise 2 weight 100
    
    # Connection limits and timeouts
    timeout connect 5s
    timeout server 30s
    timeout queue 30s

# Direct API Access (for debugging)
frontend utxo_api_direct
    bind *:8080
    default_backend utxo_api_cluster

# UTXO API Backend Pool (bypassing gateway)
backend utxo_api_cluster
    balance leastconn
    option httpchk GET /health
    http-check expect status 200
    
    # API Instances
    server api-1 utxo-api-1:3000 check inter 10s fall 3 rise 2 weight 100 maxconn 500
    server api-2 utxo-api-2:3000 check inter 10s fall 3 rise 2 weight 100 maxconn 500
    server api-3 utxo-api-3:3000 check inter 10s fall 3 rise 2 weight 100 maxconn 500
    
    # Backup server (if all primary servers fail)
    server api-backup utxo-api-1:3000 check inter 10s fall 3 rise 2 backup

# Monitoring Endpoints
frontend monitoring_frontend
    bind *:9091
    
    # Prometheus metrics
    acl prometheus_path path_beg /prometheus
    use_backend prometheus_backend if prometheus_path
    
    # Grafana dashboards
    acl grafana_path path_beg /grafana
    use_backend grafana_backend if grafana_path
    
    # Jaeger tracing
    acl jaeger_path path_beg /jaeger
    use_backend jaeger_backend if jaeger_path
    
    # Default to Grafana
    default_backend grafana_backend

backend prometheus_backend
    server prometheus prometheus:9090 check

backend grafana_backend
    server grafana grafana:3000 check

backend jaeger_backend
    server jaeger jaeger:16686 check

# Admin API for Kong (restricted access)
frontend kong_admin
    bind *:8001
    # Restrict to internal network only
    acl internal_network src 172.20.0.0/16
    http-request deny if !internal_network
    default_backend kong_admin_backend

backend kong_admin_backend
    server kong-admin api-gateway-1:8001 check

# Health Check Endpoint
frontend health_check
    bind *:8888
    monitor-uri /health
    http-request return status 200 content-type text/plain string "HAProxy OK\n"

# Global Error Handling
http-errors custom-errors
    errorfile 503 /etc/haproxy/errors/503-custom.http 