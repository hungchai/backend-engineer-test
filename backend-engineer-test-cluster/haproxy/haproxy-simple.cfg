global
    log stdout local0
    daemon

defaults
    mode http
    log global
    option httplog
    option dontlognull
    option log-health-checks
    option forwardfor
    option http-server-close
    timeout connect 5000
    timeout client 50000
    timeout server 50000

# HAProxy Statistics Page
frontend stats
    bind *:8404
    stats enable
    stats uri /stats
    stats refresh 30s
    stats admin if TRUE

# Main Frontend - HTTP Entry Point
frontend utxo_frontend
    bind *:80
    
    # Security Headers
    http-response set-header X-Frame-Options DENY
    http-response set-header X-Content-Type-Options nosniff
    http-response set-header X-XSS-Protection "1; mode=block"
    
    # Route to UTXO API cluster
    default_backend utxo_api_cluster

# UTXO API Backend Pool
backend utxo_api_cluster
    balance roundrobin
    option httpchk GET /health
    http-check expect status 200
    
    # API Instances
    server api-1 utxo-api-1:3000 check inter 10s fall 3 rise 2 weight 100
    server api-2 utxo-api-2:3000 check inter 10s fall 3 rise 2 weight 100
    server api-3 utxo-api-3:3000 check inter 10s fall 3 rise 2 weight 100
    
    # Connection limits and timeouts
    timeout connect 5s
    timeout server 30s
    timeout queue 30s 
