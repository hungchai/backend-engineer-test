input {
  # HTTP input for Kong gateway logs
  http {
    port => 5044
    codec => json
  }
  
  # Beats input for Filebeat logs
  beats {
    port => 5045
  }
  
  # TCP input for application logs
  tcp {
    port => 5046
    codec => json_lines
  }
}

filter {
  # Parse Kong access logs
  if [request] {
    mutate {
      add_field => { "service_type" => "kong-gateway" }
    }
    
    # Extract response time
    if [latencies] {
      ruby {
        code => "event.set('total_latency', event.get('[latencies][request]'))"
      }
    }
  }
  
  # Parse UTXO API logs
  if [level] {
    mutate {
      add_field => { "service_type" => "utxo-api" }
    }
    
    # Parse log level
    if [level] == "error" {
      mutate {
        add_tag => [ "error" ]
      }
    }
  }
  
  # Parse PostgreSQL logs
  if [message] =~ /^LOG:/ {
    mutate {
      add_field => { "service_type" => "postgresql" }
    }
    
    grok {
      match => { "message" => "^LOG:\s+%{GREEDYDATA:pg_message}" }
    }
  }
  
  # Parse Redis logs
  if [message] =~ /^\[/ {
    mutate {
      add_field => { "service_type" => "redis" }
    }
    
    grok {
      match => { "message" => "^\[%{INT:redis_pid}\]\s+%{TIMESTAMP_ISO8601:redis_timestamp}\s+%{WORD:redis_level}\s+%{GREEDYDATA:redis_message}" }
    }
  }
  
  # Add timestamp
  date {
    match => [ "timestamp", "ISO8601" ]
  }
  
  # Remove sensitive data
  mutate {
    remove_field => [ "headers", "password", "secret" ]
  }
}

output {
  # Send to Elasticsearch
  elasticsearch {
    hosts => ["elasticsearch:9200"]
    index => "utxo-logs-%{+YYYY.MM.dd}"
    template_name => "utxo-logs"
    template_pattern => "utxo-logs-*"
    template => {
      "index_patterns" => ["utxo-logs-*"]
      "mappings" => {
        "properties" => {
          "@timestamp" => { "type" => "date" }
          "service_type" => { "type" => "keyword" }
          "level" => { "type" => "keyword" }
          "message" => { "type" => "text" }
          "total_latency" => { "type" => "long" }
        }
      }
    }
  }
  
  # Debug output
  stdout {
    codec => rubydebug
  }
} 