services:
  # PostgreSQL Database
  postgres-primary:
    image: postgres:15-alpine
    container_name: utxo-postgres-primary
    environment:
      POSTGRES_DB: utxo_indexer
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    volumes:
      - postgres_primary_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - utxo-network
    restart: unless-stopped
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 10s
      timeout: 5s
      retries: 5

  # Redis Cache
  redis-cluster-1:
    image: redis:7-alpine
    container_name: utxo-redis-1
    command: redis-server --appendonly yes --requirepass utxo-redis-password
    volumes:
      - redis_1_data:/data
    ports:
      - "6380:6379"
    networks:
      - utxo-network
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "redis-cli", "--raw", "incr", "ping" ]
      interval: 10s
      timeout: 3s
      retries: 5

  # UTXO API Instance 1
  utxo-api-1:
    image: utxo-indexer:latest
    container_name: utxo-api-1
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres-primary:5432/utxo_indexer
      - REDIS_URL=redis://:utxo-redis-password@redis-cluster-1:6379
      - NODE_ENV=production
      - API_INSTANCE_ID=api-1
    depends_on:
      postgres-primary:
        condition: service_healthy
      redis-cluster-1:
        condition: service_healthy
    ports:
      - "3000:3000"
    networks:
      - utxo-network
    restart: unless-stopped
    healthcheck:
      test: [ "CMD", "curl", "-f", "http://localhost:3000/health" ]
      interval: 30s
      timeout: 10s
      retries: 3

  # UTXO API Instance 2
  utxo-api-2:
    image: utxo-indexer:latest
    container_name: utxo-api-2
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres-primary:5432/utxo_indexer
      - REDIS_URL=redis://:utxo-redis-password@redis-cluster-1:6379
      - NODE_ENV=production
      - API_INSTANCE_ID=api-2
    depends_on:
      postgres-primary:
        condition: service_healthy
      redis-cluster-1:
        condition: service_healthy
    ports:
      - "3002:3000"
    networks:
      - utxo-network
    restart: unless-stopped

  # UTXO API Instance 3
  utxo-api-3:
    image: utxo-indexer:latest
    container_name: utxo-api-3
    environment:
      - DATABASE_URL=postgresql://postgres:postgres@postgres-primary:5432/utxo_indexer
      - REDIS_URL=redis://:utxo-redis-password@redis-cluster-1:6379
      - NODE_ENV=production
      - API_INSTANCE_ID=api-3
    depends_on:
      postgres-primary:
        condition: service_healthy
      redis-cluster-1:
        condition: service_healthy
    ports:
      - "3003:3000"
    networks:
      - utxo-network
    restart: unless-stopped

  # HAProxy Load Balancer
  load-balancer:
    image: haproxy:2.8-alpine
    container_name: utxo-haproxy
    ports:
      - "80:80"
      - "8404:8404" # HAProxy stats
    volumes:
      - ./haproxy/haproxy-simple.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    depends_on:
      - utxo-api-1
      - utxo-api-2
      - utxo-api-3
    networks:
      - utxo-network
    restart: unless-stopped

  # Prometheus Monitoring
  prometheus:
    image: prom/prometheus:latest
    container_name: utxo-prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
    ports:
      - "9091:9090"
    volumes:
      - ./prometheus/prometheus-simple.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - utxo-network
    restart: unless-stopped

  # Grafana Dashboard
  grafana:
    image: grafana/grafana:latest
    container_name: utxo-grafana
    environment:
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "3004:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
    networks:
      - utxo-network
    restart: unless-stopped

volumes:
  postgres_primary_data:
  redis_1_data:
  prometheus_data:
  grafana_data:


networks:
  utxo-network:
    driver: bridge
